<div id="app">
<header class="topbar">
 <div class="brand"><span class="brandmark">知</span><div class="brandname">知间 <span class="brandtag">让每一次沟通都更从容</span></div></div>

  <button class="top-chip hide-mobile" data-action="drawer" data-tab="setup"><span data-icon="settings"></span><span class="label">连接设置</span></button><button class="top-chip hide-mobile" data-action="drawer" data-tab="overview"><span data-icon="sliders"></span><span class="label">管理</span></button>
  <button class="top-chip" data-action="focus"><span data-icon="minimize"></span><span class="label">极简模式</span></button>
  <button class="iconbtn mobile-contacts" data-action="mobile-contacts" aria-label="联系人"><span data-icon="users"></span></button>
 </div>
</header>
<div class="app-body">

   <div class="side-search"><span data-icon="search"></span><input id="contactSearch" aria-label="搜索联系人" placeholder="搜索联系人或会话" autocomplete="off" /></div>
  </div>
  <div class="list-controls"><strong>消息</strong><div class="filter-group"><button data-action="filter" data-filter="all" class="active">全部</button><button data-action="filter" data-filter="listening">监听中</button></div></div>
  <div class="conv-list" id="conversationList"></div>
  <div class="side-bottom"><div class="listen-summary"><span><span class="live-light"></span><span id="listenCount">3 个会话正在监听</span></span><button class="textbtn" data-action="drawer" data-tab="listening">管理</button></div><div class="side-actions"><button class="secondary" data-action="drawer" data-tab="portrait"><span data-icon="users"></span>人物画像</button><button class="secondary" data-action="drawer" data-tab="overview"><span data-icon="settings"></span>设置</button></div></div>
 </aside>
 <main class="chat-section">

      renderDrawer();notify(`已保存并启用「${stored.name}」（仅模拟）`);return true;
    }

      const sk=skillStore.find(s=>s.id===el.dataset.id);if(!sk)return true;
      if(action==='skill-use'){if(!skillAvailable(sk)){notify('该人设不适用于当前联系人');return true}c().persona=sk.id;syncPersonas();renderSuggestion();notify(`当前联系人已使用「${sk.name}」`);}
      if(action==='skill-toggle-v6'){if(!sk.builtin){sk.enabled=!sk.enabled;markSkillRevision(sk);notify(`${sk.name} 已${sk.enabled?'启用':'停用'}（模拟）`)}}

  function applyCustomPersonaSample(txt,persona,index){

   h=intro('连接中心 · 首次配置向导','从“编译与手动粘贴密钥”的开发流程，改成可诊断、可修复、可重试的正常应用连接流程。日常使用不应重复经过这些步骤。')+
   `<div class="setup-progress">${connectionSteps.map((v,i)=>`<button class="setup-step ${i===n?'active':''} ${connectionChecks[i]?'done':''}" data-action="setup-step" data-index="${i}"><span>${connectionChecks[i]?'✓':i+1}</span><small>${escape(v.title)}</small></button>`).join('')}</div>
   <div class="setup-main-card"><div class="setup-title">第 ${n+1} / ${connectionSteps.length} 步 <span class="portrait-mark">交互原型 · 模拟状态</span></div><h3>${escape(item.title)}</h3><p class="setup-summary">${escape(item.summary)}</p><p>${escape(item.detail)}</p><div class="setup-actions"><button class="primary" data-action="setup-check">${escape(item.action)}</button>${n>0?'<button class="secondary" data-action="setup-prev">上一步</button>':''}${n<connectionSteps.length-1?'<button class="secondary" data-action="setup-next">下一步</button>':'<button class="secondary" data-action="tab" data-tab="overview">返回工作区</button>'}</div><details class="setup-guide"><summary>需要自己完成哪些操作？ / 高级说明</summary><p>${escape(item.guide)}</p></details></div>
   <div class="group-heading">所有连接的状态与归属</div>
   ${connectionSteps.map((v,i)=>`<div class="setting-card"><div class="setting-main"><strong>${escape(v.title)}</strong><p>${escape(v.summary)}</p></div><span class="conn-pill ${connectionChecks[i]?'ok':'idle'}">${connectionChecks[i]?'演示检测完成':'待检测'}</span></div>`).join('')}
   <div class="notice warn"><strong>安全与 Web Token：</strong>Reader ↔ API 仍使用独立机器凭据；PC 本机网页登录应自动获取受控会话，手机经短期配对获取独立可撤销凭据。原始 Web Bearer Token 不应让用户每次复制粘贴，也不应放进浏览器源码、URL 或聊天日志。</div>
   <details class="setup-guide" style="margin-top:12px"><summary>专家选项：外部 PostgreSQL、模型地址与诊断信息</summary><p>只有用户主动启用“高级模式”时才显示数据库连接、CLI 执行路径、模型标识、代理和日志导出。修改必须由本机受控服务保存、校验与测试连接；前端不能直接接触数据库管理员密码或 Reader Token。</p></details>`;
 }
 if(drawerTab==='memories')h=intro(`${escape(x.name)} · 记忆证据`,'这里管理支持画像的原始线索、人工备注和可追溯证据。点击“人物画像”查看上层摘要。')+`<div class="notice">记忆将只属于「${escape(x.name)}」及当前账号。换联系人后不会带入其他人的背景。此处演示人工录入及证据展示。</div><div class="group-heading">当前记忆 · ${x.memory.length} 条</div><div class="memory-cards">${x.memory.length?x.memory.map((m,i)=>`<div class="memory-card"><div class="meta"><span>${escape(m.kind)}</span><button data-action="delete-memory" data-idx="${i}">删除</button></div><p>${escape(m.text)}</p><div class="evidence">${svg('book')}　${escape(m.evidence)}</div></div>`).join(''):'<div class="suggest-placeholder">暂无人物记忆。读取器解析出真实发送者后会按用户授权沉淀聊天背景。</div>'}</div><div class="group-heading">补充一条个人备注</div><textarea class="form-field" id="newMemory" rows="3" placeholder="例如：对方不喜欢临时改变约好的时间……" style="resize:vertical"></textarea><div style="display:flex;justify-content:flex-end;margin-top:9px"><button class="primary" data-action="add-memory">添加备注</button></div>`;if(drawerTab==='history')h=intro(`${escape(x.name)} · 历史消息补录`,'主动补录当前联系人在本机已有的旧消息。实时监听和历史补录共享消息库，按来源身份幂等合并。')+`<div class="notice warn">演示范围：当前账号 · 当前一对一会话 · 文本记录。任何“完成”仅代表这次所选范围内的扫描完成，不代表微信历史完整。</div><div class="group-heading">补录范围</div><div class="setting-card"><div class="setting-main"><strong>最近 90 天</strong><p>最大 5,000 条 · 按时间分批 · 保留来源冲突证据</p></div></div><div style="display:flex;gap:9px"><button class="primary" data-action="backfill" ${backfill.status==='running'?'disabled':''}>${backfill.status==='running'?'正在同步…':'同步历史消息'}</button><button class="secondary" data-action="reset-backfill">重置演示</button></div><div style="margin-top:21px" id="backfillStats"></div>`;
   if(drawerTab==='agent')h=renderSkillCenter();if(drawerTab==='health')h=intro('运行状态','这里给普通用户看“哪些能力正在工作”，而不是展示数据库表、HTTP 端点或调试堆栈。出问题时应提供可执行的恢复操作。')+`<div class="group-heading">当前应用状态 · 模拟</div>`+[['本机微信 Reader','演示在线','正在模拟 ${listenCnt} 个监听会话'],['PostgreSQL 消息库','演示就绪','消息和来源去重归档'],['AI 任务执行','演示就绪','Quick / Balanced / Deep / Max'],['长期记忆沉淀','待启用','需要账号 wxid、任务状态和证据追溯'],['手机安全访问','尚未接入','正式版需要 HTTPS 与安全配对']].map(a=>`<div class="setting-card"><span class="spark" data-icon="radio"></span><div class="setting-main"><strong>${a[0]}</strong><p>${a[2]}</p></div><span style="font-size:11px;white-space:nowrap;color:${a[1]==='演示就绪'||a[1]==='演示在线'?'#279174':'#b17e4e'}">${a[1]}</span></div>`).join('')+`<div class="notice">本 Demo 完全离线运行，状态是界面样例，不代表实际 Reader、数据库或模型已连接。未来若断开微信，应将原因、受影响会话、最后心跳和恢复动作显示在这里。</div>`;
 if(drawerTab==='preferences')h=intro('应用偏好与体验设置','正常应用应保存个人设置，不把启动参数、API Token、Python 运行环境直接展示给用户。此原型仅用于预览交互。')+`<div class="group-heading">日常使用</div><div class="setting-card"><div class="setting-main"><strong>新消息到达时提前准备建议</strong><p>未来应后台生成并缓存 Quick 建议，减少等待。原型只展示开关状态。</p></div><button class="toggle ${preferences.autoPrep?'on':''}" data-action="toggle-pref" data-key="autoPrep"></button></div><div class="setting-card"><div class="setting-main"><strong>桌面新消息提示</strong><p>只提示联系人的新消息，不公开聊天正文。</p></div><button class="toggle ${preferences.notifications?'on':''}" data-action="toggle-pref" data-key="notifications"></button></div><div class="setting-card"><div class="setting-main"><strong>在工作区优先展示三条建议</strong><p>让建议始终处于聊天记录底部的可达区域。</p></div><button class="toggle on" aria-label="始终开启" disabled></button></div><div class="group-heading">系统与连接</div><div class="setting-card"><div class="setting-main"><strong>本机数据与账号绑定</strong><p>聊天历史、联系人画像和 AI 会话分账号隔离。</p></div><span style="color:#278c70;font-weight:700;font-size:12px">已设计</span></div><div class="setting-card"><div class="setting-main"><strong>手机局域网安全配对</strong><p>正式版需 HTTPS、安全配对及有限访问权限；不要求手动复制 Bearer Token。</p></div><span style="color:#b07c4b;font-size:12px">待实现</span></div><div class="notice">设计原则：始终只读微信，建议由你复制后手动粘贴与发送。任何模式均不提供微信自动代发。</div>`;
 $('drawerContent').innerHTML=h;hydrateIcons($('drawerContent'));if(drawerTab==='history')renderBackfillStats();}
 const preferences={autoPrep:true,notifications:false,quickRoute:'fast'};const skillSettings={tone:true,evidence:true,topics:true,boundary:true};
 function renderBackfillStats(){const box=$('backfillStats');if(!box)return;if(backfill.status==='idle'){box.innerHTML='<div class="suggest-placeholder">尚未开始本次历史补录。点击“同步历史消息”查看任务状态和对账结果。</div>';return}box.innerHTML=`<div class="group-heading">本次任务 · ${backfill.status==='running'?'进行中':'已完成（模拟）'}　${backfill.percentage}%</div><div class="progress-track"><div class="progress-fill" style="width:${backfill.percentage}%"></div></div><div class="stat-grid" style="margin-top:12px"><div class="stat-item"><strong>${Math.floor(backfill.percentage*1.31)}</strong><span>已扫描</span></div><div class="stat-item"><strong>${Math.floor(backfill.percentage*.96)}</strong><span>已匹配</span></div><div class="stat-item"><strong>${Math.floor(backfill.percentage*.35)}</strong><span>新补录</span></div></div>${backfill.status==='done'?'<p style="color:#668b77;font-size:12px;margin-top:13px">本次有界扫描完成。0 条需人工核对，原有消息未被覆盖。</p>':'<p style="color:#81968c;font-size:12px;margin-top:13px">正在读取本机历史并对账；不会发送任何微信消息。</p>'}`}
 function backfillStart(){if(backfill.status==='running')return;backfill={status:'running',percentage:0};renderDrawer();clearInterval(backfillTimer);backfillTimer=setInterval(()=>{backfill.percentage=Math.min(100,backfill.percentage+17);if(backfill.percentage>=100){backfill.status='done';clearInterval(backfillTimer);c().historyBackfilled=true;notify('模拟历史补录已完成')}renderBackfillStats();if(backfill.status==='done')renderDrawer()},500)}
 function toggleListen(id){const v=convs.find(y=>y.id===id);if(!v)return;v.listen=!v.listen;renderConvs();renderChatHeader();renderDrawer();notify(`${v.name} 已${v.listen?'加入':'退出'}后台监听（模拟）`)}
 function changeAccount(id){const a=accounts.find(z=>z.id===id);if(!a)return;selectedAccount=id;const first=convs.find(z=>z.account===id);if(first)selectedConv=first.id;fullRender();if(!a.active)notify('此账号仅为界面演示：未登录，不会实际读取消息');else notify(`已切换到 ${a.name}`)}
 function handleAction(e){const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action.startsWith('skill-')&&skillAction(el))return; if(action==='setup-step'){connectionStep=Math.max(0,Math.min(3,Number(el.dataset.index)||0));renderDrawer();return}if(action==='setup-next'){connectionStep=Math.min(3,connectionStep+1);renderDrawer();return}if(action==='setup-prev'){connectionStep=Math.max(0,connectionStep-1);renderDrawer();return}if(action==='setup-check'){connectionChecks[connectionStep]=true;renderDrawer();notify('已完成模拟检测：真实应用应调用本机诊断接口');return}if(action==='portrait-refresh'){portraitRefreshes[c().id]=true;renderDrawer();notify('人物画像已模拟更新；正式版需显示变化与证据');return}if(action==='portrait-correct'){const val=$('portraitCorrection')?.value.trim();if(!val){notify('请先填写需要纠正的事实或备注');return}c().memory.unshift({kind:'用户更正',text:val,evidence:'当前用户主动更正 · 不能直接当作聊天事实'});renderDrawer();notify('已保存为人工备注（演示），待用于画像核验');return}if(action==='save-self'){const p=selfProfiles[selectedAccount];p.voice=$('selfVoice')?.value.trim()||p.voice;p.boundary=$('selfBoundary')?.value.trim()||p.boundary;p.notes=$('selfNotes')?.value.trim()||p.notes;renderDrawer();notify('已保存此账号的表达偏好（演示）');return}if(action==='switch'){switchConv(el.dataset.id);return}if(action==='filter'){filter=el.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));renderConvs();return}if(action==='simulate'){simulateMessage();return}if(action==='focus'){focus(true);return}if(action==='workspace'){focus(false);closeDrawer();return}if(action==='focus-expand'){$('focusDetails').classList.toggle('hidden');return}if(action==='focus-choose'){focus(false);$('sidebar').classList.add('open');$('sideOverlay').classList.remove('hidden');return}if(action==='focus-persona'){const cur=personas.findIndex(p=>p[0]===$('personaSelect').value);$('personaSelect').value=personas[(cur+1)%personas.length][0];c().persona=$('personaSelect').value;renderSuggestion();generate();return}if(action==='generate'){generate();return}if(action==='cancel-generate'){cancelGenerate();return}if(action==='copy'){copy(Number(el.dataset.idx));return}if(action==='ask'){ask();return}if(action==='ask-example'){ask(el.dataset.q);return}if(action==='older'){olderLoaded.add(c().id);renderMessages(false);notify('已加载更早的演示消息');return}if(action==='drawer'){openDrawer(el.dataset.tab||'overview');return}if(action==='tab'){drawerTab=el.dataset.tab;document.querySelectorAll('.drawer-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===drawerTab));renderDrawer();return}if(action==='close-drawer'){closeDrawer();return}if(action==='mobile-contacts'){$('sidebar').classList.toggle('open');$('sideOverlay').classList.toggle('hidden');$('aiPanel').classList.remove('open');$('aiOverlay').classList.add('hidden');return}if(action==='ai-open'){$('aiPanel').classList.add('open');$('aiOverlay').classList.remove('hidden');return}if(action==='ai-close'){$('aiPanel').classList.remove('open');$('aiOverlay').classList.add('hidden');return}if(action==='toggle-listen'){toggleListen(el.dataset.id);return}if(action==='add-memory'){const val=$('newMemory')?.value.trim();if(!val){notify('请先输入要保存的备注');return}c().memory.unshift({kind:'用户备注',text:val,evidence:'用户手动录入 · 不作为聊天事实'});renderDrawer();notify('人物备注已保存（仅当前演示页）');return}if(action==='delete-memory'){c().memory.splice(Number(el.dataset.idx),1);renderDrawer();notify('已移除该条演示记忆');return}if(action==='backfill'){backfillStart();return}if(action==='reset-backfill'){backfill={status:'idle',percentage:0};clearInterval(backfillTimer);renderDrawer();return}if(action==='toggle-skill'){const key=el.dataset.key;skillSettings[key]=!skillSettings[key];renderDrawer();notify('Skill 偏好已更新（演示）');return}if(action==='toggle-pref'){const key=el.dataset.key;preferences[key]=!preferences[key];renderDrawer();notify('偏好已更新（演示）');return}}
 document.addEventListener('click',handleAction);
 $('drawerContent').addEventListener('change',e=>{if(e.target.id==='quickRouteSelect'){preferences.quickRoute=e.target.value;notify('快速回复路由已切换（演示）')}});
 $('contactSearch').addEventListener('input',renderConvs);
 $('accountSelect').addEventListener('change',e=>changeAccount(e.target.value));
 syncPersonas();
 $('personaSelect').addEventListener('change',()=>{c().persona=$('personaSelect').value;renderSuggestion()});
 $('thinkingSelect').addEventListener('change',()=>{c().level=$('thinkingSelect').value;renderSuggestion()});
 $('aiInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
 hydrateIcons();fullRender();
})();
</script>
