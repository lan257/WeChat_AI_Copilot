function replyFor(question){const s=getSession(),mem=(st.memories[st.selected]||[]);const m=mem[0]||'当前已有聊天';if(/话题|主动|无聊|开场|找她|找他/.test(question))return `想主动联系 ${s.name}，可以从已有的「${s.topic}」自然切入，不必突然找一个新话题。\n\n例如：「${s.id==='c1'?'对了，你之前提到的徒步路线，我刚想起来，最近天气挺合适的，你还有兴趣去吗？':s.id==='c2'?'对了，之前你说的那个项目现在怎么样啦？':'对了，你之前推荐我的那本书，我最近又翻了几页，想起你说的那句话了。'}」\n\n依据：${m}。如果目前不想聊这个，也可以从对方近期愿意分享的话题开始。`;
if(/决定|判断|值不值得|该不该|建议|分析/.test(question))return `我们可以把它当作一个选择题来看，而不是只追求一条“最正确”的回复。\n\n① 当前已知：${s.name} 最近在聊「${s.topic}」。\n② 不确定：对方此刻的安排或想法，不能靠聊天语气猜测。\n③ 建议：先用轻量、不施压的方式确认意愿，然后再决定是否推进。\n\n如果你告诉我你在两种选择之间纠结什么，我可以按利弊继续分析。`;
if(/他|她|对方|意思|怎么看|理解|情绪/.test(question))return `从最近这段对话看，${s.name} 的明确表达集中在「${s.topic}」上。\n\n我会区分“聊天原文能确定的事实”和“可能的解释”：对方表达了具体信息，但不能据此断言心理或关系状态。\n\n你可以先回应事实，再用一个开放问题了解更多。`;
return `我会基于你与 ${s.name} 的当前聊天和已保存记忆来思考这个问题。\n\n当前话题：${s.topic}。已知线索：${m}。\n\n如果是想回复消息，我可以帮你列出几种措辞；如果是更复杂的沟通决策，我们可以继续讨论不同选择的利弊。\n\n（这是离线演示回复，没有实际调用模型。）`}

function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastId);toastId=setTimeout(()=>el.classList.remove('show'),2600)}
function tagFor(s){return `<span class="avatar" style="background:${s.color};color:${s.avatarInk}">${s.avatar}</span>`}
function options(){return seeds.map(s=>`<option value="${s.id}" ${st.selected===s.id?'selected':''}>${esc(s.name)} · ${esc(s.topic)}</option>`).join('')}
function hdr(){return `<header class="app-header"><div class="brand"><span class="brand-symbol">${ico('message','lg')}</span><div><div class="brand-title">知间 <span style="font-weight:470;color:#74858a;font-size:12px">/ AI 沟通助手</span></div><div class="brand-subtitle">PRIVATE CONVERSATION COPILOT</div></div></div><div class="top-switch" role="group" aria-label="页面模式"><button data-action="mode" data-value="work" class="${st.mode==='work'?'active':''}">${ico('sliders')} 工作区模式</button><button data-action="mode" data-value="focus" class="${st.mode==='focus'?'active':''}">${ico('panels')} 简洁模式</button></div><div class="header-actions"><span class="demo-chip">交互原型 · 模拟数据</span><button class="icon-btn ${st.preview?'active':''}" data-action="preview" aria-label="切换窄屏预览" title="切换手机分屏宽度">${ico('phone')}</button></div></header>`}

function workChat(){const s=getSession();const thread=st.agentThreads[st.selected]||[];return `<div class="work-chat-page"><div class="chat-page-header"><div><div class="eyebrow">CONVERSATION WORKSPACE</div><h1>聊天工作区</h1><p>左侧掌握聊天上下文，右侧和 AI 自由讨论。当前内容均为演示数据。</p></div><button class="button soft" data-action="mode" data-value="focus">${ico('panels','sm')} 进入简洁模式</button></div><div class="chat-page-tools"><div class="chat-selected">${tagFor(s)}<div><strong>${esc(s.name)}</strong><span>${esc(s.topic)} · 账号：我的微信（模拟）</span></div></div><select aria-label="选择当前聊天会话" id="workSession" class="field select" data-field="selected">${options()}</select><button class="button sm" data-action="simulate">${ico('plus','sm')} 模拟来信</button></div><div class="chat-work-grid"><section class="work-thread-panel" aria-label="当前聊天窗口"><div class="work-panel-head"><div><strong>聊天记录</strong><span>实时上下文 · 只读</span></div><span class="badge teal">${getMsgs().length} 条消息</span></div><div class="work-messages" id="chatScroll">${chatLines(50)}</div><div class="work-recommendations"><div class="recommendation-head"><strong>${ico('sparkle','sm')} AI 回复建议</strong><span class="micro">${personas[st.persona]} · 第 ${st.batch%2+1} 组</span></div><div class="work-choice-list">${choiceButtons('work-choice')}</div><div class="work-reco-actions"><button class="button sm" data-action="persona">人设：${personas[st.persona]}　${ico('refresh','sm')}</button><button class="button sm" data-action="generate">${ico('refresh','sm')} 换一批</button><span class="micro">点击任一建议即复制</span></div></div></section><section class="work-agent-panel" aria-label="基于当前会话的 AI 咨询"><div class="work-panel-head"><div><strong>${ico('sparkle','sm')} AI 深度咨询</strong><span>仅针对「${esc(s.name)}」的聊天上下文</span></div><span class="badge">Agent 演示</span></div><div class="agent-dialog" id="agentScroll"><div class="agent-intro"><span class="agent-spark">✳</span><strong>关于这段关系，你可以随时问我</strong><p>比如主动找话题、分析对话、沟通决策。不局限于生成回复。</p></div>${thread.map(m=>`<div class="agent-msg ${m.role==='user'?'from-user':'from-ai'}"><span class="agent-msg-label">${m.role==='user'?'你':'AI · 模拟'}</span><div>${esc(m.text)}</div></div>`).join('')}</div><div class="agent-compose"><div class="agent-examples"><button data-action="agent-example" data-value="我有点无聊，想主动找她聊聊，有什么自然的话题？">主动找话题</button><button data-action="agent-example" data-value="她的这段话可能是什么意思？">理解对方</button><button data-action="agent-example" data-value="我在犹豫要不要主动约她，帮我分析利弊。">辅助决策</button></div><label class="sr-only" for="aiQuestion">向 AI 提问</label><textarea id="aiQuestion" rows="3" placeholder="基于当前聊天，向 AI 问任何问题…（Enter 发送）"></textarea><div class="agent-send-bar"><span>仅返回建议，不发送微信消息</span><button class="button primary sm" data-action="agent-ask">${ico('send','sm')} 发送</button></div></div></section></div></div>`}

function work(){const pages={chat:workChat,overview,connection,memory,agent,settings};return `<div class="workspace">${side()}<main class="work-main ${st.nav==='chat'?'work-chat-main':''}">${(pages[st.nav]||workChat)()}</main></div>`}
function focus(){const s=getSession();return `<main class="tiny-focus-wrap"><section class="tiny-focus" aria-label="超简洁 AI 回复建议"><div class="tiny-head"><button class="tiny-expand" data-action="expand" aria-expanded="${!!st.expanded}">${ico('chevron','sm')} ${st.expanded?'收起':'展开'}</button></div>${st.expanded?`<div class="tiny-more"><div class="tiny-more-title">当前会话</div><select class="field select" data-field="selected" aria-label="选择会话">${options()}</select><div class="tiny-more-title">最近消息</div><div class="tiny-context">${getMsgs().slice(-3).map(m=>`<div><b>${isMine(m)?'我':esc(s.name)}：</b>${esc(m.text)}</div>`).join('')}</div><button class="button sm wide" data-action="mode" data-value="work">进入聊天工作区 / 更多配置 ${ico('arrow','sm')}</button></div>`:''}<div class="tiny-choices">${choiceButtons('tiny-choice')}</div><div class="tiny-controls"><button class="tiny-control tiny-persona" data-action="persona" title="点击切换下一个预设人设"><span class="persona-mark">◉</span> 人设 · ${personas[st.persona]} <span class="tiny-caret">⌄</span></button><button class="tiny-control tiny-refresh" data-action="generate">${ico('refresh','sm')} 换一批</button></div></section></main>`}
function render(){document.body.classList.toggle('viewport-sim',!!st.preview);root.innerHTML=`<div class="app-shell ${st.mode==='focus'?'compact-shell':''}">${st.mode==='focus'?'':hdr()}${st.mode==='focus'?focus():work()}</div>`;const chat=root.querySelector('#chatScroll');if(chat)chat.scrollTop=chat.scrollHeight;store()}
function modeChange(value){st.mode=value;if(value==='work')st.nav='chat';st.expanded=false;render()}
function handle(action,value,e){switch(action){
case 'mode':modeChange(value);break;
case 'preview':st.preview=!st.preview;render();break;
case 'nav':st.nav=value;render();break;
case 'select-session':st.selected=value;render();notify('已选中 '+getSession().name);break;
case 'open-session':st.selected=value;st.mode='work';st.nav='chat';st.style=0;st.showMemory=false;render();break;
case 'bridge':st.bridge=!st.bridge;render();notify('仅更新演示状态，未操作微信接入服务');break;
case 'swap-identity':st.calibration[st.selected]=!st.calibration[st.selected];render();notify('已互转当前会话的本人 / 对方身份');break;
case 'capture':st.enabled[value]=!st.enabled[value];render();notify('仅修改演示采集配置');break;
case 'toggle':st[value]=!st[value];render();break;
case 'save-settings':store();notify('已保存到当前浏览器，仅供演示');break;
case 'delete-memory':st.memories[st.selected].splice(Number(value),1);render();notify('已删除演示记忆');break;
case 'add-memory':{const inp=document.getElementById('newMemory');const text=inp?.value?.trim();if(!text){notify('请先填写一条记忆');return}st.memories[st.selected]??=[];st.memories[st.selected].push(text);render();notify('已加入演示记忆');break}
case 'reset-demo':{if(!confirm('重置全部本地演示数据和设置？'))return;try{localStorage.removeItem(KEY)}catch{};st=JSON.parse(JSON.stringify(defaults));render();notify('已重置演示数据');break}
case 'style':st.style=Number(value);delete st.customDraft[st.selected];render();break;
case 'memory-show':st.showMemory=!st.showMemory;render();break;
case 'generate':{st.batch=(st.batch+1)%2;render();notify('已切换一组模拟建议');break}
case 'persona':st.persona=(st.persona+1)%personas.length;st.batch=0;render();notify('已切换至'+personas[st.persona]+'人设');break;
case 'expand':st.expanded=!st.expanded;render();break;
case 'copy-suggestion':{const txt=choices()[Number(value)];if(!txt)return;copyText(txt).then(()=>notify('备选'+['一','二','三'][Number(value)]+'已复制')).catch(()=>notify('复制失败，请手动选择'));break}
case 'agent-example':askAgent(value);break;
case 'agent-ask':{const question=document.getElementById('aiQuestion')?.value?.trim();if(!question){notify('输入问题后再发送');return}askAgent(question);break}
case 'agent-clear':st.agentThreads[st.selected]=[];render();break;
case 'simulate':{const ms=getMsgs(st.selected).slice();const next=ms.at(-1)?.text?.includes('如果太赶')?'那我们按这个计划，到时候再联系～':'补充一下，如果太赶，我们改到下周也可以～';const now=new Date();ms.push({from:'other',time:now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}),text:next});setMsgs(st.selected,ms);render();notify('模拟收到一条新消息');break}
case 'copy':{const text=(document.getElementById('draft')?.value||'').trim();if(!text){notify('没有可复制的内容');return}copyText(text).then(()=>notify('已复制，回到微信粘贴即可')).catch(()=>notify('复制失败，请手动选择文本'));break}
}}
function askAgent(question){const thread=st.agentThreads[st.selected]||[];thread.push({role:'user',text:question},{role:'assistant',text:replyFor(question)});st.agentThreads[st.selected]=thread;render();const el=document.getElementById('agentScroll');if(el)el.scrollTop=el.scrollHeight;notify('已添加一轮模拟 AI 对话')}
async function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();let ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy failed')}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)handle(el.dataset.action,el.dataset.value,e)});
root.addEventListener('change',e=>{const el=e.target;switch(el.dataset.field){case 'selected':st.selected=el.value;st.style=0;st.batch=0;st.showMemory=false;render();break;case 'provider':st.provider=el.value;store();break;case 'tone':st.tone=el.value;store();break}});
root.addEventListener('input',e=>{const el=e.target;if(el.dataset.field==='draft'){st.customDraft[st.selected]=el.value;store()}if(el.dataset.field==='tone'){st.tone=el.value;store()}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newMemory'){e.preventDefault();handle('add-memory')}if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='aiQuestion'){e.preventDefault();handle('agent-ask')}});
render();
})();
</script>
</body>
</html>
