name: build-and-test

# Two jobs on purpose. The PostgreSQL-gated suites require port 55439 and a database whose name
# contains "test"; Windows runners do not support service containers, so those tests run on Linux
# while the shipping artefact is produced on Windows.

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Build Release
        run: dotnet build WeChatAiCopilot.sln -c Release --nologo

      - name: Unit tests (PostgreSQL-gated suites self-skip without their env vars)
        run: dotnet test WeChatAiCopilot.sln -c Release --no-build --nologo

      - name: Reader offline tests
        run: python -m unittest discover -s tests/reader_tests -p 'test_*.py' -v

      - name: Build the shippable package (same code path a maintainer runs locally)
        shell: pwsh
        run: ./scripts/Build-ReleasePackage.ps1

      - name: Install the package like a recipient would, then boot it without a database
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'artifacts/release/*.zip' | Select-Object -First 1
          if (-not $zip) { throw '发布包没有生成' }
          ./scripts/Install-FromPackage.ps1 -PackageZip $zip.FullName `
            -InstallRoot "$env:LOCALAPPDATA\Programs\WeChatAiCopilotCi"
          $root = "$env:LOCALAPPDATA\Programs\WeChatAiCopilotCi\artifacts\app\win-x64"
          $exe = Join-Path $root 'WeChatAiCopilot.Api.exe'
          if (-not (Test-Path $exe)) { throw '安装后的可执行文件不存在' }
          $env:ASPNETCORE_URLS = 'http://127.0.0.1:5099'
          $process = Start-Process $exe -WorkingDirectory $root -PassThru
          try {
            $live = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest 'http://127.0.0.1:5099/health/live' -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $live = $true; break }
              } catch { }
            }
            if (-not $live) { throw '安装后的应用在本机启动不起来（没有数据库时应仍能提供存活探针）' }
            $asset = Invoke-WebRequest 'http://127.0.0.1:5099/v8/main.js' -UseBasicParsing
            if ($asset.Headers['Cache-Control'] -notmatch 'no-store') { throw '发布包里的静态资源仍会被浏览器缓存' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            # The installed copy owns no user data; removing it keeps the runner clean.
            $probe = Get-NetTCPConnection -LocalPort 5099 -State Listen -ErrorAction SilentlyContinue
            if ($probe) { Stop-Process -Id $probe.OwningProcess -Force -ErrorAction SilentlyContinue }
            Remove-Item -LiteralPath "$env:LOCALAPPDATA\Programs\WeChatAiCopilotCi" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Check no runtime data or secrets are published
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Path 'artifacts/app/win-x64' -Recurse -File -Include `
            '*.dump','secrets.json','scope.json','*.pem','*.pfx','appsettings.Production.json' -ErrorAction SilentlyContinue
          if ($bad) { $bad | ForEach-Object { Write-Host "unexpected file: $($_.Name)" }; throw 'publish output contains runtime data or secrets' }

      - uses: actions/upload-artifact@v4
        with:
          name: app-win-x64
          path: artifacts/app/win-x64
          if-no-files-found: error

      - name: Upload the release package for hand-off
        uses: actions/upload-artifact@v4
        with:
          name: wechat-ai-copilot-release
          path: artifacts/release/*
          if-no-files-found: error

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        ports:
          - 55439:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: copilot_ci_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WECHAT_AI_COPILOT_V6_TEST_POSTGRES: 'Host=127.0.0.1;Port=55439;Database=copilot_ci_test;Username=postgres;Password=ci-only-password'
      WECHAT_AI_COPILOT_M2_TEST_POSTGRES: 'Host=127.0.0.1;Port=55439;Database=copilot_ci_test;Username=postgres;Password=ci-only-password'
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Migration-backed integration tests
        run: dotnet test WeChatAiCopilot.sln -c Release --nologo | tee test-output.txt

      # These suites silently self-skip when their env vars are missing, which would make this job
      # green without ever touching PostgreSQL. Treat any skip as a failure.
      - name: Fail if any PostgreSQL-gated test was skipped
        shell: bash
        run: |
          if grep -Eq 'Skipped: +[1-9]|已跳过: +[0-9]{1,}[1-9]' test-output.txt; then
            grep -E 'Skipped:|已跳过:' test-output.txt
            echo 'PostgreSQL-gated tests were skipped; the service container or env vars are wrong.'
            exit 1
          fi
          grep -Eq 'Passed!|失败:|Failed!' test-output.txt || { echo 'no test summary found'; exit 1; }
          echo 'integration tests ran without skips'
